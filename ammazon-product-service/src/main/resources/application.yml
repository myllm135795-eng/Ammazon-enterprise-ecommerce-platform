spring:
  application:
    name: ammazon-product-service
  data:
    mongodb:
      uri: mongodb://ammazon:ammazon_password@localhost:27017/ammazon_products
      auto-index-creation: true
  elasticsearch:
    uris: http://localhost:9200
  redis:
    host: localhost
    port: 6379
    timeout: 60000ms
  cache:
    type: redis
    redis:
      time-to-live: 1800000
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  cloud:
    discovery:
      enabled: true

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

server:
  port: 8083
  servlet:
    context-path: /

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true